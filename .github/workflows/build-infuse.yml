name: Build Infuse jar

on:
  push:
    branches: [ "dev/2.4.5" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Match the version your server runs (Minecraft 1.21.11 on Java 21)
        run: |
          sed -i "s/javaVersion=.*/javaVersion=21/" gradle.properties
          sed -i "s/minecraftVersion=.*/minecraftVersion=1.21.11/" gradle.properties
          sed -i "s/^version=.*/version=2.4.5-beta21/" gradle.properties
      - name: Build the plugin
        run: ./gradlew build
      - name: Save the jar
        uses: actions/upload-artifact@v4
        with:
          name: Infuse-jar
          path: build/libs/*.jar
